<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ user.full_name }} — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="page-wrapper">

    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">DevOps_intern</span>
    </div>

    <div class="card profile-card">

      <div class="success-banner">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Account created successfully
      </div>

      <div class="profile-hero">
        <div class="avatar">{{ user.initials }}</div>
        <div class="profile-name-block">
          <h1>{{ user.full_name }}</h1>
          <span class="username-tag">@{{ user.username }}</span>
        </div>
        <div class="joined-badge">Joined {{ user.joined }}</div>
      </div>

      <div class="profile-grid">

        <div class="info-block">
          <span class="info-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Email
          </span>
          <span class="info-value">{{ user.email }}</span>
        </div>

        <div class="info-block">
          <span class="info-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.81a19.79 19.79 0 01-3.07-8.64A2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.18 6.18l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/></svg>
            Phone
          </span>
          <span class="info-value">{{ user.phone }}</span>
        </div>

        <div class="info-block">
          <span class="info-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Date of Birth
          </span>
          <span class="info-value">{{ user.dob }}</span>
        </div>

        <div class="info-block">
          <span class="info-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Age
          </span>
          <span class="info-value">{{ user.age }} years old</span>
        </div>

      </div>

      <div class="profile-actions">
        <a href="{{ url_for('logout') }}" class="btn-outline">Sign out</a>
        <a href="{{ url_for('register') }}" class="btn-primary">Create another account &rarr;</a>
      </div>

    </div>

  </div>

</body>
</html>
